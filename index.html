<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>File Browser - run.topli.ch</title>
<style>
body { font-family: sans-serif; margin: 40px; }
a { text-decoration: none; color: #0366d6; }
a:hover { text-decoration: underline; }
ul { list-style-type: none; padding-left: 20px; }
</style>
</head>
<body>
<h1>📂 Files in run.topli.ch</h1>
<div id="file-list">Loading...</div>

<script>
const repoOwner = "toplich";        // заміни на свій логін
const repoName = "run";             // заміни на свій репозиторій
const branch = "main";              // або "master"

async function listFiles(path = "") {
  const url = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/${path}?ref=${branch}`;
  const res = await fetch(url);
  if (!res.ok) return `<li>❌ Error loading ${path}</li>`;
  const data = await res.json();

  let html = "<ul>";
  for (const item of data) {
    if (item.type === "dir") {
      html += `<li>📁 <strong>${item.name}</strong>${await listFiles(item.path)}</li>`;
    } else {
      html += `<li>📄 <a href="${item.download_url}" target="_blank">${item.path}</a></li>`;
    }
  }
  html += "</ul>";
  return html;
}

(async () => {
  document.getElementById("file-list").innerHTML = await listFiles();
})();
</script>
</body>
</html>
