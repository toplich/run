version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ${DATA_PATH}:/data
      - ./${CERT_DIR}:/root/.minio/certs
    environment:
      MINIO_ROOT_USER: ${ROOT_USER}
      MINIO_ROOT_PASSWORD: ${ROOT_PASS}
      MINIO_SERVER_URL: ${ENDPOINT}
      MINIO_BROWSER_REDIRECT_URL: ${GUI}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "--insecure", "${ALIAS}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
